<style>
:root{--ink:#0d1b2a;--floor:#FF6A00;--ball:#FF8A3D;--bg:#eef1f5;--w:#fff;--line:#e2e8ef;--mut:#5d6b7a;--g:#12905a;--r:#d6384a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
header{position:relative;overflow:hidden;background:var(--ink);color:#fff;padding:18px 16px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header::before{content:"";position:absolute;inset-inline-end:-60px;top:-70px;width:220px;height:220px;border-radius:50%;border:2px solid rgba(255,255,255,.12);box-shadow:0 0 0 26px rgba(255,255,255,.04)}
header::after{content:"";position:absolute;inset-inline-start:0;bottom:0;width:100%;height:3px;background:linear-gradient(90deg,var(--ball),var(--floor))}
header h1{margin:0;font-size:20px;font-weight:700;flex:1 1 220px;display:flex;align-items:center;gap:10px;position:relative}
header h1::before{content:"";width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffa56b,var(--ball) 60%);flex:none}
header input{position:relative;padding:9px 12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;width:140px;font:inherit}
header input::placeholder{color:rgba(255,255,255,.55)}
header input:focus{outline:2px solid var(--ball);border-color:transparent}
nav{display:flex;gap:6px;padding:10px 12px;background:rgba(238,241,245,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5;max-width:1000px;margin:auto}
nav button{flex:1;padding:11px 6px;border:1px solid var(--line);border-radius:12px;background:var(--w);color:var(--mut);font:inherit;font-weight:600;cursor:pointer;transition:.15s}
nav button.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 4px 12px rgba(13,27,42,.25)}
main{padding:4px 12px 90px;max-width:1000px;margin:auto}
.card{background:var(--w);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(13,27,42,.04)}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--ink)}
.c{margin:3px;padding:9px 15px;border:1px solid var(--line);background:#f7f9fb;color:var(--ink);border-radius:12px;font:inherit;font-weight:500;cursor:pointer;transition:.12s}
.c:hover{border-color:var(--floor)}
.c.on{background:var(--floor);color:#fff;border-color:var(--floor);box-shadow:0 3px 10px rgba(27,108,168,.35)}
.c.ok.on{background:var(--g);border-color:var(--g)}.c.no.on{background:var(--r);border-color:var(--r)}
.c.ok,.c.no{font-size:20px;padding:8px 30px}
input,select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#f7f9fb;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--floor);background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.save{position:sticky;bottom:12px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--ball);color:#fff;font:700 17px inherit;font-family:inherit;cursor:pointer;box-shadow:0 8px 22px rgba(255,106,31,.45)}
.save:active{transform:scale(.99)}
.tools{display:flex;flex-wrap:wrap}.tools button,.sm{padding:9px 14px;border:0;border-radius:10px;background:var(--ink);color:#fff;font:inherit;font-weight:500;cursor:pointer;margin:3px}
.sm{padding:5px 11px;font-size:13px}.sm.x{background:var(--r)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center}
th{background:#f3f6f9;color:var(--mut);font-weight:600;font-size:13px}
th:first-child{border-radius:0 10px 0 0}th:last-child{border-radius:10px 0 0 0}
td:first-child{font-weight:600;text-align:start}
tr:nth-child(even) td{background:#fafbfd}
.bar{display:inline-block;height:8px;background:linear-gradient(90deg,var(--floor),var(--ball));border-radius:4px;vertical-align:middle;margin-inline-start:8px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi div{background:#f3f6f9;border-radius:14px;padding:12px;text-align:center;color:var(--mut);font-size:13px}
.kpi b{display:block;font-size:28px;font-weight:700;color:var(--ink);line-height:1.2}
.kpi div:nth-child(2) b{color:var(--g)}.kpi div:nth-child(5) b{color:var(--r)}
.hide{display:none}.ph{display:none}
@media(max-width:560px){header input{flex:1 1 40%;width:auto}.c{padding:10px 13px}}
@media print{header,nav,.tools,.sm{display:none!important}.ph{display:block;margin-bottom:10px}body{background:#fff}.card{break-inside:avoid;box-shadow:none}main{padding:0}}
.rep .hd{text-align:center;margin:6px 0 12px}.rep .hd h2{margin:0;font-size:22px}.rep .hd p{margin:2px 0;color:var(--mut)}
.sc{display:flex;justify-content:center;align-items:center;gap:26px;text-align:center}.sc b{display:block;font-size:46px;line-height:1.1}.sc i{font-size:36px;font-style:normal;color:var(--mut)}.sc small{font-size:15px;font-weight:600}
.rep .kpi{margin-bottom:12px}.rep .kpi b{font-size:22px}.tl{font-weight:700;margin:8px 2px}
.rep h4{margin:10px 0 6px;color:var(--floor)}.rep table+table{margin-top:10px}.rep ul{margin:4px 0;padding-inline-start:20px}.rep p{margin:4px 0}
.zs{display:flex;flex-wrap:wrap;gap:8px}.zs span{background:#f3f6f9;border-radius:10px;padding:6px 12px}.zs b{margin-inline-end:6px;color:var(--ball);font-size:18px}
.dash>h3{margin:18px 4px 8px}
@page{size:A4;margin:10mm}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.dash{display:none!important}.pgb{break-before:page}.rep .card{padding:8px 10px;margin-bottom:8px}.rep th,.rep td{padding:4px 6px;font-size:12px}.rep .sc b{font-size:34px}.rep .kpi b{font-size:18px}body{font-size:12px}}
.ft{direction:ltr;text-align:center;color:var(--mut);font-size:12px;line-height:1.5;padding:14px 12px 28px}
@media print{@page{size:A4;margin:10mm 10mm 16mm}.ft{position:fixed;bottom:0;left:0;right:0;padding:4px 0 0;border-top:1px solid #bbb;background:#fff;font-size:10px;color:#444}}
.rep svg text{font-family:inherit;fill:#14222f}.lg{margin:8px 0 2px;font-size:13px;color:var(--mut)}
.ihf{background:#fff;color:#000;font:11px/1.4 Arial,"IBM Plex Sans Arabic",sans-serif;direction:ltr;padding:10px;border-radius:12px}
.ihf .hd{border:1px solid #000;padding:8px;text-align:center}.ihf h2{margin:0;font-size:17px}.ihf h3{margin:10px 0 3px;font-size:13px;border-bottom:1px solid #000}.ihf h4{margin:8px 0 2px;font-size:12px}
.ihf .ml{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 2px;gap:8px}.ihf .sc{font-size:19px;font-weight:700;text-align:center}.ihf .hv{font-size:12px;font-weight:400}
.it{width:100%;border-collapse:collapse;margin:3px 0 6px}.it th,.it td{border:1px solid #444;padding:2px 4px;text-align:center;font-size:11px;background:#fff}.it th{background:#e6e6e6}.it td:nth-child(2){text-align:left}.it.tt tr:last-child td{font-weight:700;background:#f0f0f0}
.ihf .two{display:flex;gap:14px}.ihf .two>div{flex:1}.ihf .cl{font-size:10px;text-align:center}.ihf svg text{fill:#000;font-family:Arial,sans-serif}
@media print{.ihf{padding:0;border-radius:0}.pgi{break-before:page}}
.ihf.rtl{direction:rtl}.ihf.rtl .it td:nth-child(2){text-align:right}.it.pb td{text-align:start}.it.pb td:nth-child(1){width:9%}.it.pb td:nth-child(3){width:11%;text-align:center;font-weight:700}.it.pb tr.gg td{background:#f2f2f2}.ihf .rf{font-size:11px;margin:2px 0 6px}.it.sg td{height:34px}.it thead{display:table-header-group}.it tr{break-inside:avoid}
@media print{.np{display:none!important}}

function trT(t){const k=t.trim();if(!k)return t;let r=UD[k];if(r===undefined)for(const [re,f] of UP){const m=k.match(re);if(m){r=f(...m.slice(1).map(x=>trT(x)));break}}return r===undefined?t:t.match(/^\s*/)[0]+r+t.match(/\s*$/)[0]}
